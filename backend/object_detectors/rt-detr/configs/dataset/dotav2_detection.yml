task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

# DOTAv2 (1024 tiles): 18 classes with category_id 1..18.
# num_classes is 19 so the "no-object" slot does not collide with a class id.
num_classes: 19
remap_mscoco_category: False


train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/DOTAv2/images/
    ann_file: ./dataset/DOTAv2/annotations/instances_train2017.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFuncion


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/DOTAv2/images/
    ann_file: ./dataset/DOTAv2/annotations/instances_val2017.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFuncion
