task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

# DIOR: 20 classes with category_id 1..20.
# num_classes is set to 21 so the "no-object" slot (index num_classes)
# does not collide with any real class id. Slot 0 is unused.
num_classes: 21
remap_mscoco_category: False


train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/DIOR/train/
    ann_file: ./dataset/DIOR/annotations/instances_train2017.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFuncion


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/DIOR/val/
    ann_file: ./dataset/DIOR/annotations/instances_val2017.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFuncion
